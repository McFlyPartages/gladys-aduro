# -----------------------------------------------------------------------------
# Build & publish the multi-architecture image.
#
# Triggers:
#   - a Git version tag (e.g. `v1.2.0`) -> release build. Tags are pushed to
#     Forgejo and reach GitHub through the push mirror (see "Releasing" in
#     CLAUDE.md): a mirror push triggers workflows, unlike GITHUB_TOKEN pushes;
#   - a manual run (workflow_dispatch) on any branch -> test build;
#   - workflow_call -> release build of a given version (kept for reuse).
# Result: an image pushed to the GitHub Container Registry (ghcr.io), for
# linux/amd64 AND linux/arm64 (Raspberry Pi, etc.).
#
# Manual runs tag the image with the branch name (or the `image-tag` input)
# and never touch `latest`. Release builds tag `:<version>` AND `:latest`.
#
# That is ALL it takes to "publish": tag, push, and the decentralized indexer
# does the rest (no review, no account to create).
# -----------------------------------------------------------------------------
name: Build and publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  # For a caller workflow that pushes the tag itself with the default
  # GITHUB_TOKEN (such a tag does NOT re-trigger `push: tags`). None today:
  # releases come from a tag pushed to Forgejo and mirrored (see CLAUDE.md).
  workflow_call:
    inputs:
      version:
        description: 'Released version, e.g. 1.2.0 (publishes :<version> + :latest)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub only: the repository lives on Forgejo and is push-mirrored to
    # GitHub, whose runners publish the image to ghcr.io. The Forgejo runner
    # has neither Docker nor the registry credentials.
    if: github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Release build (workflow_call): check out the tag of the version,
          # otherwise the default checkout would be the pre-bump
          # commit and the image would bundle a stale manifest. Hand-pushed
          # tags and manual runs keep the default checkout.
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || '' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Detect a release build by the `version` input, NOT the event name:
          # inside a called (workflow_call) workflow, GITHUB_EVENT_NAME is the
          # caller's event ("workflow_dispatch"), so it cannot tell the two
          # apart. The input is only set by a workflow_call caller.
          if [ -n "$INPUT_VERSION" ]; then
            # Release build driven by a caller: it already bumped and tagged
            # this exact version. Publish `:<version>` AND move `latest`.
            version="${INPUT_VERSION}"
            tags="${image}:${version},${image}:latest"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual test build: use the input tag, or the branch name
            # (slashes replaced by dashes). Never move `latest`.
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Cannot use 'latest' as a manual image tag."
              exit 1
            fi
            tags="${image}:${version}"
          else
            # Tag `v1.2.0` (pushed to Forgejo, mirrored) -> 1.2.0
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
          fi
          echo "image_ref=${image}:${version}" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Docker build summary
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          # Manifest with `docker_image` pointing at the image just pushed,
          # ready to paste into Gladys developer mode. Same rule as the Release
          # workflow (bumpManifest in .github/scripts/release.mjs): the
          # sub-containers running the integration's own image follow it, the
          # third-party ones keep theirs.
          manifest=$(jq --arg image "$IMAGE_REF" '
            def name: sub("@.*$"; "") | sub(":[^/]*$"; "");
            [.docker_image, $image | strings | name] as $own
            | .docker_image = $image
            | (.containers[]? | select(.docker_image | strings | name | IN($own[])))
                .docker_image = $image
            ' gladys-assistant-integration.json)
          {
            echo "## Docker build summary"
            echo ""
            echo "Image pushed (linux/amd64 + linux/arm64):"
            echo ""
            echo '```'
            echo "$IMAGE_REF"
            echo '```'
            echo ""
            echo "### Test this build in Gladys"
            echo ""
            echo "1. In Gladys, open **Integrations → Install an integration → Developer mode**."
            echo "2. Copy the manifest below (its \`docker_image\` already points to this build):"
            echo ""
            echo '```json'
            echo "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
